name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests: pure logic, no network, no browser, no Windows.
  # Runs on Linux because the tested code is platform-independent — if it ever
  # stops being so, this job is what will notice.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is no longer provisioned on ubuntu-latest runners, so the matrix
        # starts at the oldest version still available there.
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show environment
        run: |
          python --version
          node --version || true

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  # ---------------------------------------------------------------------------
  # Script checks: PowerShell parsing, portability rules, credential hygiene.
  # Needs Windows because it parses the real .ps1 files with the PS engine.
  # ---------------------------------------------------------------------------
  script-checks:
    name: PowerShell checks (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out PowerShell version
        run: $PSVersionTable.PSVersion

      - name: Run static checks
        shell: pwsh
        run: ./tests/test-scripts.ps1

      - name: Assert no credentials are tracked
        shell: pwsh
        run: |
          $tracked = git ls-files
          $bad = $tracked | Where-Object { $_ -match '(^|/)cookies\.txt$|stage1\.json$|\.venv/' }
          if ($bad) {
            Write-Error "credential files are tracked: $bad"
            exit 1
          }
          Write-Host "no credential files tracked"

  # ---------------------------------------------------------------------------
  # End-to-end wiring: prove yt-fetch.ps1 finds Python, installs/uses yt-dlp and
  # reaches the point where it asks YouTube for data. It is expected to FAIL the
  # actual download here (GitHub runners have no cookies and their IP is blocked),
  # so we assert on the shape of the failure rather than on success.
  # ---------------------------------------------------------------------------
  wiring:
    name: Wiring smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Script finds Python and yt-dlp
        shell: pwsh
        run: |
          Write-Host "--- environment ---"
          Write-Host "python on PATH: $((Get-Command python -ErrorAction SilentlyContinue).Source)"
          Write-Host "RUNNER_TOOL_CACHE: $env:RUNNER_TOOL_CACHE"
          python -c "import sys, yt_dlp; print(sys.version); print('yt-dlp', yt_dlp.version.__version__)"

          # Assert on the process exit code and the two failure signatures that
          # indicate broken plumbing. The network outcome is irrelevant here:
          # a runner has no cookies, so YouTube may or may not answer.
          $ErrorActionPreference = 'Continue'
          $out = & .\yt-fetch.ps1 -Url dQw4w9WgXcQ -Mode info 2>&1 | Out-String
          $code = $LASTEXITCODE
          $plain = $out -replace "`e\[[0-9;]*[A-Za-z]", ''

          Write-Host "--- script output (exit $code) ---"
          Write-Host $plain

          if ($plain -match 'Python 3\.8\+ not found') {
            Write-Host "::error::script could not locate a Python interpreter"
            exit 1
          }
          if ($plain -match 'No module named yt_dlp') {
            Write-Host "::error::script could not use the installed yt-dlp"
            exit 1
          }
          if ($plain -match 'is not recognized as the name of a cmdlet') {
            Write-Host "::error::a cmdlet failed to resolve inside the script"
            exit 1
          }

          # Positive evidence the script got past interpreter discovery and built
          # its yt-dlp invocation: either it warned about cookies, or yt-dlp ran
          # far enough to report a YouTube-side result.
          $gotPastWiring = ($plain -match 'cookie') -or ($plain -match 'author:') `
                          -or ($plain -match 'not a bot') -or ($plain -match 'duration_sec')
          if (-not $gotPastWiring) {
            Write-Host "::error::script did not reach the yt-dlp invocation stage"
            exit 1
          }

          Write-Host "wiring OK: python, yt-dlp and argument assembly all work"

          # A non-zero yt-dlp exit (bot check, no cookies) is expected here and
          # must not be inherited as this step's own result.
          exit 0

      - name: Cookie exporter never crashes with a raw traceback
        shell: pwsh
        run: |
          # A runner has no browser profile. The exporter must explain that and
          # exit non-zero WITHOUT dumping a Python traceback.
          #
          # Wrapped in cmd /c so a non-zero Python exit cannot be mistaken for a
          # PowerShell pipeline error; we only care about the text it printed.
          $log = Join-Path $env:RUNNER_TEMP 'exporter.log'
          cmd /c "python scripts/export-cookies.py --browser chrome --out test-cookies.txt > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          $plain = (Get-Content $log -Raw -Encoding UTF8) -replace "`e\[[0-9;]*[A-Za-z]", ''

          Write-Host "--- exporter output (exit $code) ---"
          Write-Host $plain

          if (Test-Path test-cookies.txt) { Remove-Item test-cookies.txt -Force }
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          if ($plain -match 'Traceback \(most recent call last\)') {
            Write-Host "::error::exporter raised an unhandled exception"
            exit 1
          }
          if ($plain -notmatch 'no cookie database|Local State not found|cannot read') {
            Write-Host "::error::exporter did not explain why it could not proceed"
            exit 1
          }

          Write-Host "exporter fails cleanly with an explanation (exit $code)"

          # The native exit code must not leak into this step's result: we already
          # asserted on the text, which is the actual subject of the test.
          exit 0

      - name: Hard-subtitle script parses
        shell: pwsh
        run: |
          # Inspect the real parameter list via the AST (Get-Help output is
          # localized and unreliable across Windows versions).
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\extract-hardsubs.ps1), [ref]$null, [ref]$null)
          $declared = $ast.ParamBlock.Parameters |
            ForEach-Object { $_.Name.VariablePath.UserPath }
          Write-Host "declared parameters: $($declared -join ', ')"

          $expected = @('Video', 'Interval', 'Crop', 'Scale', 'Out', 'Ffmpeg')
          $missing = $expected | Where-Object { $declared -notcontains $_ }
          if ($missing) {
            Write-Error "missing parameters: $($missing -join ', ')"
            exit 1
          }
          Write-Host "extract-hardsubs.ps1 exposes all documented parameters"

  # ---------------------------------------------------------------------------
  # Docs: make sure the README image and the generator stay in sync.
  # ---------------------------------------------------------------------------
  docs:
    name: Docs assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: README references the demo image
        run: |
          grep -q 'docs/demo.png' README.md \
            || { echo "README does not reference docs/demo.png"; exit 1; }
          test -f docs/demo.png \
            || { echo "docs/demo.png is missing"; exit 1; }
          echo "demo image present and referenced"

      - name: Demo generator is valid Python
        run: python -m py_compile docs/make-demo.py && echo "make-demo.py compiles"

      - name: Skill file has required frontmatter
        run: |
          head -1 SKILL.md | grep -qx -- '---' \
            || { echo "SKILL.md must start with frontmatter"; exit 1; }
          grep -q '^name: youtube-via-proxy' SKILL.md \
            || { echo "SKILL.md is missing the name field"; exit 1; }
          grep -q '^description: ' SKILL.md \
            || { echo "SKILL.md is missing the description field"; exit 1; }
          echo "SKILL.md frontmatter OK"
